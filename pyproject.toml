[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tai-ho-so-thue-gtgt"
version = "1.0.0"
description = "Tải hồ sơ thuế GTGT từ Cổng Dịch vụ công của Cục Thuế (dichvucong.gdt.gov.vn)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dieutx" }]
keywords = ["gdt", "thue", "dichvucong", "tax", "vietnam"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business",
]
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<7",
    "openpyxl>=3.1,<4",
    "requests>=2.32,<3",
    "pypdf>=6.21.1,<7",
]

[project.optional-dependencies]
# Mỗi bộ nhận dạng CAPTCHA một extra, tên trùng với GDT_CAPTCHA_SOLVER.
ocr-ddddocr = ["ddddocr>=1.5", "onnxruntime>=1.17"]
ocr-easyocr = [
    "easyocr>=1.7,<2",
    "opencv-python-headless>=4.10,<6",
    "numpy>=1.24,<3",
]
ocr-paddleocr = [
    "paddleocr>=2.7,<3",
    "paddlepaddle>=2.6",
    "opencv-python-headless>=4.10,<6",
    "numpy>=1.24,<3",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Repository = "https://gitlab.com/dieutx/tai-ho-so-thue-gtgt"
Issues = "https://gitlab.com/dieutx/tai-ho-so-thue-gtgt/-/issues"

[project.scripts]
gdt-tax = "gdt_tax.cli:main"
gdt-gnt = "gdt_tax.gnt.cli:main"
gdt-tb = "gdt_tax.tb.cli:main"
gdt-inventory = "gdt_tax.inventory:main"
gdt-parse = "gdt_tax.parser.cli:main"
gdt-classify = "gdt_tax.classify:main"
gdt-export = "gdt_tax.export:main"
gdt-migrate-identity = "gdt_tax.migrate_identity:main"

[tool.setuptools.packages.find]
include = ["gdt_tax*", "desktop*"]

[tool.setuptools.package-data]
gdt_tax = ["form_mappings/*.json", "form_mappings/*.md"]
desktop = ["resources/*.svg", "resources/*.ico", "resources/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
