name: Windows desktop
on:
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Build artifact test, skip release smoke gate'
        type: boolean
        default: false
  push:
    tags: ['desktop-v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Build and verify one-file EXE
        if: ${{ !inputs.test_only }}
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Build test EXE (no release smoke gate)
        if: ${{ inputs.test_only }}
        shell: pwsh
        run: ./scripts/build_windows.ps1 -SkipSmoke
      - name: Upload test artifact
        if: ${{ inputs.test_only }}
        uses: actions/upload-artifact@v4
        with:
          name: TaiHoSoThue-Windows-test
          path: dist/TaiHoSoThue-Windows.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload release artifact
        if: ${{ !inputs.test_only }}
        uses: actions/upload-artifact@v4
        with:
          name: TaiHoSoThue-Windows-x64
          path: dist/TaiHoSoThue-Windows.exe
          if-no-files-found: error
