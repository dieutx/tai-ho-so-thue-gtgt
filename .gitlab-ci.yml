# CI cho GitLab: chạy test, lint và mypy như README/CONTRIBUTING.
# Test offline, không cần thư viện OCR và
# không cần tài khoản.

stages:
  - test
  - lint

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: pip
  paths:
    - .cache/pip

test:
  stage: test
  image: python:$PYTHON_VERSION
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.12"]
  script:
    - python -m pip install --upgrade pip
    - python -m pip install .
    - python -m unittest discover -s tests -t . -v

lint:
  stage: lint
  image: python:3.12
  script:
    - python -m pip install --upgrade pip
    - python -m pip install ".[dev]"
    - ruff check .
    - mypy gdt_tax
