name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test trên Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cài package và thư viện test (không gồm OCR)
        run: python -m pip install .

      - name: Chạy unit test
        run: python -m unittest discover -s tests -t . -v

  lint:
    name: Lint và kiểm tra kiểu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài công cụ kiểm tra
        run: python -m pip install ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Kiểm tra kiểu
        run: mypy gdt_tax

  desktop:
    name: Kiểm thử giao diện Windows (Qt offscreen)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cài ứng dụng và Qt dùng trong bản desktop
        run: python -m pip install . PySide6-Essentials==6.8.3
      - name: Chạy cả test desktop và core
        run: python -m unittest discover -s tests -t . -v
