name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test trên Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cài thư viện cần cho test (không gồm easyocr)
        run: python -m pip install --upgrade pip beautifulsoup4 lxml openpyxl requests

      - name: Chạy unit test
        run: python -m unittest discover -s tests -t . -v

  lint:
    name: Lint và kiểm tra kiểu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài công cụ kiểm tra
        run: python -m pip install ruff mypy beautifulsoup4 lxml openpyxl requests
      - name: Lint
        run: ruff check .
      - name: Kiểm tra kiểu
        run: mypy gdt_tax
