# CI cho GitLab: chạy test, lint và mypy như README/CONTRIBUTING.
# Test offline, không cần thư viện OCR và
# không cần tài khoản.

stages:
  - test
  - lint
  - windows

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: pip
  paths:
    - .cache/pip

test:
  stage: test
  image: python:$PYTHON_VERSION
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.12"]
  script:
    - python -m pip install --upgrade pip
    - python -m pip install .
    - python scripts/run_test_gate.py --profile minimal
  artifacts:
    when: always
    paths:
      - .cache/ci/minimal.json

lint:
  stage: lint
  image: python:3.12
  script:
    - python -m pip install --upgrade pip
    - python -m pip install ".[dev]"
    - ruff check .
    - mypy gdt_tax tests/test_core_contracts.py

windows-full:
  stage: windows
  tags: [windows-x64]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^desktop-v/'
      when: on_success
    - when: manual
      allow_failure: true
  script:
    - py -3.11 -m venv .venv-release
    - .venv-release/Scripts/python.exe -m pip install --no-deps -r requirements-desktop-windows-py311.lock
    - .venv-release/Scripts/python.exe -m pip install --no-deps --no-build-isolation -e .
    - .venv-release/Scripts/python.exe -m pip check
    - .venv-release/Scripts/python.exe scripts/dependency_inventory.py verify --profile runtime
    - powershell -NoProfile -File scripts/build_windows.ps1 -Python .venv-release/Scripts/python.exe -SkipInstall
  artifacts:
    when: always
    paths:
      - .cache/ci/
      - .cache/smoke-*/source-report.json
      - .cache/smoke-*/report-*.json
      - .cache/optimization/gitlab-published.json
      - dist/SHA256SUMS.txt
      - dist/release-manifest.json
